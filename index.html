        .projects {

    </style>
</head>

<body>

    <div class="name">ibcel</div>

    <div class="projects">
        <h2>PROJETOS</h2>
    </div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 1, 4);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.body.appendChild(renderer.domElement);

// Luces
const ambientLight = new THREE.AmbientLight(0xffffff, 2);
scene.add(ambientLight);

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(3, 5, 4);
scene.add(light);

// Material
const mtlLoader = new MTLLoader();

mtlLoader.load('Eggdog.mtl', function(materials) {

    materials.preload();

    const objLoader = new OBJLoader();
    objLoader.setMaterials(materials);

    objLoader.load('Eggdog.obj', function(eggdog) {

        // Centrar modelo
        const box = new THREE.Box3().setFromObject(eggdog);
        const center = box.getCenter(new THREE.Vector3());

        eggdog.position.sub(center);

        // Ajustar tamaño
        const size = box.getSize(new THREE.Vector3());
        const maxSize = Math.max(size.x, size.y, size.z);

        const scale = 2 / maxSize;
        eggdog.scale.setScalar(scale);

        scene.add(eggdog);

        window.eggdog = eggdog;

    }, undefined, function(error) {
        console.error('Error cargando Eggdog.obj:', error);
    });

}, undefined, function(error) {
    console.error('Error cargando Eggdog.mtl:', error);
});

// Animación
function animate() {

    requestAnimationFrame(animate);

    if (window.eggdog) {
        window.eggdog.rotation.y += 0.01;
    }

    renderer.render(scene, camera);
}

animate();

// Responsive
window.addEventListener('resize', () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
